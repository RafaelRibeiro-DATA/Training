<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training</title>
<meta name="description" content="Treino A–E com checklist, cargas, descanso e evolução.">
<meta name="theme-color" content="#0c0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: app de celular, uma coluna (máx. 480px) com barra de navegação embaixo. Cada treino (A–E) tem sua cor. */
:root {
  --bg: #0c0f14;
  --surface: #151a22;
  --surface-2: #1d232d;
  --surface-3: #262d39;
  --line: #2a313d;
  --fg: #eef1f6;
  --muted: #98a2b3;
  --primary: #b8295f;
  --brand-2: #4c1d95;
  --primary-ink: #ffffff;
  --ok: #34d399;
  --warn: #fbbf24;
  --danger: #f87171;
  --body: #2c3440;
  --day-a: #b8295f;
  --day-b: #6a3fc1;
  --day-c: #2c55a8;
  --day-d: #1f8352;
  --day-e: #6b7380;
  --font-display: "Sora", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }
.screen { padding-block: 18px 150px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -.2px; text-wrap: balance; }
h1 { font-size: 1.65rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.tnum { font-variant-numeric: tabular-nums; }

/* botões */
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 600; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
a.btn { color: var(--fg); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 8px 12px; font-size: .85rem; border-radius: 10px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }

/* selo do treino */
.badge { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: #fff; flex: none; }
.badge.lg { width: 60px; height: 60px; border-radius: 18px; font-size: 1.7rem; }
.badge.sm { width: 32px; height: 32px; border-radius: 10px; font-size: .95rem; }

/* início */
.hero { border-radius: 24px; padding: 20px; color: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.10); }
.hero::before { content: ""; position: absolute; right: 30px; bottom: -70px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.07); }
.hero .eyebrow { color: rgba(255,255,255,.8); }
.hero h2 { font-size: 1.6rem; }
.hero .meta { display: flex; gap: 14px; font-size: .85rem; color: rgba(255,255,255,.88); flex-wrap: wrap; }
.hero .btn { background: #fff; color: #10131a; position: relative; z-index: 1; }
.chips { display: flex; gap: 8px; }
.chip { flex: 1; border: 0; background: var(--surface); border-radius: 14px; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .72rem; color: var(--muted); }
.chip .badge { width: 34px; height: 34px; border-radius: 11px; font-size: 1rem; }
.chip[aria-pressed="true"] { outline: 2px solid var(--fg); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .74rem; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; border: 0; width: 100%; text-align: left; }
.item .t { font-weight: 600; }
.item .s { font-size: .8rem; color: var(--muted); }
.chev { color: var(--muted); flex: none; }
.empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 18px 8px; }

/* sessão */
.topbar { display: flex; align-items: center; gap: 12px; }
.ring { width: 58px; height: 58px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .82rem; font-variant-numeric: tabular-nums; }
.ex { background: var(--surface); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 12px; transition: opacity .2s; }
.ex.done { opacity: .55; }
.ex.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; }
.ex-head { display: flex; gap: 12px; align-items: center; }
.thumbwrap { position: relative; flex: none; }
.fotobtn { position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--surface); background: var(--surface-3); color: var(--fg); display: grid; place-items: center; padding: 0; }
.fotobtn svg { width: 15px; height: 15px; }
.thumb { width: 76px; height: 76px; border-radius: 14px; background: var(--surface-2); flex: none; overflow: hidden; display: grid; place-items: center; border: 0; padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb svg { width: 100%; height: 100%; }
.nm { font-weight: 600; line-height: 1.25; }
.sr { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.check { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: transparent; flex: none; display: grid; place-items: center; padding: 0; }
.check svg { width: 22px; height: 22px; opacity: 0; }
.check[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.check[aria-checked="true"] svg { opacity: 1; }
.last { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sets { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; }
.set { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.set label { font-size: .68rem; color: var(--muted); text-align: center; letter-spacing: .5px; }
.set input { width: 100%; text-align: center; padding: 10px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 1rem; }
.set input::placeholder { color: var(--muted); opacity: .6; font-weight: 500; }
textarea { width: 100%; min-height: 72px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 10px 12px; resize: vertical; }

/* barra de descanso (só na sessão) */
.restbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); width: min(448px, calc(100% - 32px)); background: var(--surface-3); border-radius: 18px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 20; }
.restbar .lbl { font-size: .8rem; color: var(--muted); }
.restbar .time { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; min-width: 64px; }
.restbar .btn { padding: 8px 10px; font-size: .82rem; border-radius: 10px; background: var(--surface); }
.restbar.going { background: var(--primary); color: #fff; }
.restbar.going .lbl { color: rgba(255,255,255,.85); }
.restbar.going .btn { background: rgba(255,255,255,.18); color: #fff; }
.restbar.over { background: var(--ok); color: #06261a; }

/* navegação */
nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); z-index: 30; }
nav.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: .7rem; color: var(--muted); font-weight: 600; }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--primary); }

/* folha de detalhe */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.hero-img { width: 100%; aspect-ratio: 4/3; border-radius: 18px; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; max-width: 100%; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; }
.hero-img svg { width: 100%; height: 100%; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .76rem; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.tag.main { color: #fff; }
.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* histórico */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 14px; padding: 4px; }
.seg button { border: 0; background: transparent; padding: 9px; border-radius: 10px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); }
select.field, input.field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.chart { width: 100%; height: 170px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
.pr { color: var(--warn); font-weight: 700; }
.detail { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: .84rem; }

/* edição */
.edit { background: var(--surface); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.edit-grid { display: grid; grid-template-columns: 1.2fr 64px 1fr; gap: 6px; }
.edit-grid > * { min-width: 0; }
.edit-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100% - 32px); }
.confirm { background: var(--surface-2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.banner { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .82rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <main id="screen" class="screen" aria-live="polite">
    <div class="card"><h2>Carregando…</h2><p class="muted small">Preparando seus treinos.</p></div>
  </main>
  <div id="restslot"></div>
  <nav class="tabs" id="tabs" aria-label="Navegação">
    <button data-go="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-go="treinos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Treinos</button>
    <button data-go="historico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>Evolução</button>
    <button data-go="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </nav>
  <input type="file" id="file-foto" accept="image/*" hidden>
  <input type="file" id="file-backup" accept="application/json,.json" hidden>
</div>

<script>
(() => {
"use strict";
const APP_NOME = "Training";
const VERSAO = "1.0";
const DIAS = ["A", "B", "C", "D", "E"];
const COR = { A: "var(--day-a)", B: "var(--day-b)", C: "var(--day-c)", D: "var(--day-d)", E: "var(--day-e)" };
const MUSC = { peito: "Peito", ombros: "Ombros", biceps: "Bíceps", triceps: "Tríceps", antebraco: "Antebraço", abdomen: "Abdômen", costas: "Costas", trapezio: "Trapézio", lombar: "Lombar", gluteos: "Glúteos", quadriceps: "Quadríceps", posteriores: "Posteriores de coxa", panturrilha: "Panturrilha", cardio: "Cardio" };

// ---------------- plano padrão ----------------
const E = (id, nome, series, reps, musc, sec, dicas, tipo = "carga") => ({ id, nome, series, reps, tipo, musc, sec, dicas });
const AQ = (p) => E(p + "0", "Aquecimento", 1, "5 min de bike + séries leves", ["cardio"], [], ["5 minutos de bicicleta ou elíptico em ritmo leve.", "Depois, 1 ou 2 séries leves do primeiro exercício, sem cansar."], "check");
const PLANO_PADRAO = [
  { id: "A", nome: "Superior", foco: "Peito, costas, ombros e braços", exercicios: [AQ("a"),
    E("a1", "Supino reto com barra", 3, "8–10", ["peito"], ["triceps", "ombros"], ["Escápulas juntas e pés firmes no chão.", "Desça a barra até a linha do peito, controlando."]),
    E("a2", "Puxada frontal (pulley)", 3, "10–12", ["costas"], ["biceps"], ["Puxe a barra até a parte de cima do peito.", "Leve os cotovelos para baixo, sem jogar o corpo para trás."]),
    E("a3", "Desenvolvimento com halteres", 3, "10–12", ["ombros"], ["triceps"], ["Comece com os halteres na altura das orelhas.", "Suba sem travar os cotovelos e sem arquear a lombar."]),
    E("a4", "Remada baixa no cabo", 3, "10–12", ["costas"], ["biceps", "trapezio"], ["Coluna reta, puxe o pegador até o umbigo.", "Junte as escápulas no final do movimento."]),
    E("a5", "Rosca direta (barra W)", 3, "10–12", ["biceps"], ["antebraco"], ["Cotovelos parados ao lado do corpo.", "Desça devagar, sem balançar o tronco."]),
    E("a6", "Tríceps na polia com corda", 3, "12–15", ["triceps"], [], ["Cotovelos colados ao corpo.", "No final, abra a corda para os lados."]),
    E("a7", "Prancha", 3, "30–45 s", ["abdomen"], ["lombar"], ["Corpo reto da cabeça aos pés.", "Contraia o abdômen e não deixe o quadril cair."], "tempo") ] },
  { id: "B", nome: "Inferior", foco: "Pernas completas", exercicios: [AQ("b"),
    E("b1", "Agachamento livre", 3, "8–10", ["quadriceps", "gluteos"], ["posteriores", "lombar"], ["Pés na largura dos ombros, joelhos acompanham a ponta dos pés.", "Desça como se fosse sentar, peito aberto. Pode usar o Smith."]),
    E("b2", "Leg press 45°", 3, "10–12", ["quadriceps"], ["gluteos"], ["Lombar sempre encostada no banco.", "Não trave os joelhos lá em cima."]),
    E("b3", "Stiff com halteres", 3, "10–12", ["posteriores"], ["gluteos", "lombar"], ["Joelhos levemente flexionados e coluna reta.", "Leve o quadril para trás até sentir alongar atrás da coxa."]),
    E("b4", "Cadeira extensora", 3, "12–15", ["quadriceps"], [], ["Ajuste o encosto para o joelho ficar alinhado ao eixo.", "Segure 1 segundo em cima."]),
    E("b5", "Mesa flexora", 3, "12–15", ["posteriores"], [], ["Quadril colado no banco.", "Suba rápido e desça devagar."]),
    E("b6", "Panturrilha em pé", 4, "12–15", ["panturrilha"], [], ["Desça bem o calcanhar para alongar.", "Suba até a ponta dos pés e segure 1 segundo."]) ] },
  { id: "C", nome: "Empurrar", foco: "Peito, ombros e tríceps + cardio", exercicios: [AQ("c"),
    E("c1", "Supino inclinado com halteres", 3, "8–12", ["peito"], ["ombros", "triceps"], ["Banco entre 30° e 45°.", "Desça os halteres até a linha do peito."]),
    E("c2", "Peck deck (voador)", 3, "12–15", ["peito"], [], ["Cotovelos levemente flexionados.", "Junte as mãos à frente e volte devagar."]),
    E("c3", "Desenvolvimento na máquina", 3, "10–12", ["ombros"], ["triceps"], ["Costas apoiadas no encosto.", "Suba sem travar os cotovelos."]),
    E("c4", "Elevação lateral com halteres", 4, "12–15", ["ombros"], ["trapezio"], ["Suba os braços até a altura dos ombros.", "Use carga leve e sem balanço."]),
    E("c5", "Tríceps francês com halter", 3, "10–12", ["triceps"], [], ["Cotovelos apontados para cima.", "Desça o halter atrás da cabeça com controle."]),
    E("c6", "Paralelas assistidas", 3, "8–12", ["triceps", "peito"], ["ombros"], ["Use a máquina com contrapeso, se precisar.", "Desça até o cotovelo fazer 90°."]),
    E("c7", "Cardio: bike ou escada", 1, "15 min, ritmo moderado", ["cardio"], [], ["Ritmo em que você consegue falar, mas com esforço.", "Ajuda o condicionamento sem atrapalhar o ganho de massa."], "check") ] },
  { id: "D", nome: "Puxar", foco: "Costas e bíceps", exercicios: [AQ("d"),

    h("p", { class: "muted small", style: "text-align:center", text: APP_NOME + " · versão " + VERSAO }),
  ];
}
function aplicarTema() { document.documentElement.setAttribute("data-theme", "dark"); }
async function exportar() {
  const fotos = {};
  for (const id of Object.keys(S.fotos)) { const b = await idb.get("foto:" + id); if (b) fotos[id] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
  const dados = { app: "training", versao: VERSAO, exportado: new Date().toISOString(), plano: S.plano, sessoes: S.sessoes, atual: S.atual, fotos };
  const blob = new Blob([JSON.stringify(dados)], { type: "application/json" });
  const nome = "backup-treino-" + hojeISO() + ".json";
  try { if (navigator.canShare && navigator.canShare({ files: [new File([blob], nome)] })) { await navigator.share({ files: [new File([blob], nome, { type: "application/json" })], title: "Backup do treino" }); return; } } catch (e) {}
  const a = h("a", { href: URL.createObjectURL(blob), download: nome }); document.body.append(a); a.click(); a.remove(); toast("Backup exportado ✓");
}
$("#file-backup").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const dados = JSON.parse(await f.text()); if (dados.app !== "training" && dados.app !== "shape" || !Array.isArray(dados.plano)) throw new Error("arquivo");
    S.plano = dados.plano; S.sessoes = dados.sessoes || []; S.atual = dados.atual || null;
    await salvar("plano"); await salvar("sessoes"); if (S.atual) await salvar("atual"); else await idb.del("atual");
    for (const [id, url] of Object.entries(dados.fotos || {})) { const b = await (await fetch(url)).blob(); await idb.set("foto:" + id, b); S.fotos[id] = URL.createObjectURL(b); }
    ir("inicio"); toast("Backup importado ✓");
  } catch (err) { toast("Esse arquivo não é um backup válido do app."); }
});

// ---------------- início ----------------
(async () => {
  await idb.open();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  S.plano = (await idb.get("plano")) || clone(PLANO_PADRAO);
  S.sessoes = (await idb.get("sessoes")) || [];
  S.atual = (await idb.get("atual")) || null;
  aplicarTema();
  if (!(await idb.get("plano"))) await salvar("plano");
  for (const d of S.plano) for (const ex of d.exercicios) { const b = await idb.get("foto:" + ex.id); if (b) S.fotos[ex.id] = URL.createObjectURL(b); }
  ir(S.atual ? "sessao" : "inicio");
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.tela === "sessao") renderRest(); });
})();
})();
</script>

<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
